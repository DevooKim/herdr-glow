id = "devookim.herdr-glow"
name = "Herdr Glow"
version = "0.3.1"
min_herdr_version = "0.9.0"
description = "Ambient edge glow while an agent is blocked or done"
platforms = ["macos"]

[[build]]
command = ["sh", "-c", "swiftc -O src/glow.swift -o bin/glow && swiftc -O src/toast.swift -o bin/toast"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/on-status-changed.sh"]

[[events]]
on = "pane.closed"
command = ["./bin/on-status-changed.sh"]

[[events]]
on = "pane.exited"
command = ["./bin/on-status-changed.sh"]
